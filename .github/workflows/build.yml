name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Caffeine
        run: >-
          xcodebuild
          -project src/Caffeine.xcodeproj
          -scheme Caffeine
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/DerivedData"
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Stage app bundle
        run: |
          mkdir -p "$RUNNER_TEMP/artifact"
          cp -R "$RUNNER_TEMP/DerivedData/Build/Products/Debug/Caffeine.app" "$RUNNER_TEMP/artifact/"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: caffeine-macos
          path: ${{ runner.temp }}/artifact/*
          if-no-files-found: error
